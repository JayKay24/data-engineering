data_sources:
  - source_id: user_events_kafka
    source_type: kafka
    kafka_config:
      bootstrap_servers: "localhost:9092"
      topic: "user-events-avro"
      starting_offsets: "earliest"
    schema_registry:
      url: "http://localhost:8081"
      subject: "user-events-avro-value"
      schema_file: "schemas/user_event.avsc"

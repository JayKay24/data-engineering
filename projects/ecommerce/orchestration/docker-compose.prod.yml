# Low-RAM (<2.6 GB) production Compose override layered on top of docker-compose.yml:
#   docker compose --env-file ../../../.env -f docker-compose.yml -f docker-compose.prod.yml up -d
# Tunes Postgres/Redis memory, enables in-Airflow Spark availableNow + synthetic events,
# restricts Redpanda/Airflow host port exposure, enables read-only Superset guest mode,
# and adds an optional Cloudflare Tunnel (`--profile tunnel`).

services:
  redpanda:
    ports: !reset []

  postgres:
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]

  redis:
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  airflow:
    environment:
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      SPARK_IN_AIRFLOW: "true"
      PRODUCE_SYNTHETIC_EVENTS: ${PRODUCE_SYNTHETIC_EVENTS:-true}
    ports: !override
      - "127.0.0.1:8080:8080"

  superset:
    environment:
      SUPERSET_PUBLIC_READONLY: ${SUPERSET_PUBLIC_READONLY:-true}
      GUNICORN_WORKERS: "2"

  cloudflared:
    image: cloudflare/cloudflared:2024.11.1
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - superset
    restart: unless-stopped

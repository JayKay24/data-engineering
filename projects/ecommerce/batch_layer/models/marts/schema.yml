version: 2

models:
  - name: cumulative_users
    description: "Historical cumulative user growth cohorts"
  - name: daily_category_sales
    description: "Aggregated daily category revenue and volume"
  - name: monthly_category_sales
    description: "Aggregated monthly category revenue trends"
  - name: daily_top_urls
    description: "Daily URL activity summaries by interaction type"
  - name: daily_top_urls_per_user
    description: "Top 5 visited URLs per user by day"
  - name: daily_url_conversion
    description: "Daily consolidated URL conversion performance"
  - name: new_vs_returning_users
    description: "Daily breakdown of new vs returning active users"
  - name: customer_segment_spending
    description: "Customer spending enriched with PostgreSQL OLTP segment and region dimensions"
    columns:
      - name: user_id
        tests:
          - not_null
      - name: segment
        tests:
          - not_null
  - name: brand_category_performance
    description: "Product brand and category revenue enriched with PostgreSQL OLTP product dimensions"
    columns:
      - name: brand
        tests:
          - not_null
      - name: category
        tests:
          - not_null

version: 2

models:
  - name: last_ingest
    description: "Freshness and pipeline latency monitor over streaming url_counts"
  - name: gx_quality_checks
    description: "Great Expectations batch and Gold mart validation results"
    columns:
      - name: suite_name
        tests:
          - not_null
      - name: expectation_type
        tests:
          - not_null
  - name: pydeequ_quality_checks
    description: "PyDeequ distributed Spark quality verification results"
    columns:
      - name: constraint_name
        tests:
          - not_null
      - name: constraint_status
        tests:
          - not_null
  - name: quarantine_summary
    description: "Summary of domain-invalid events routed to the quarantine Delta DLQ"
    columns:
      - name: quarantine_reason
        tests:
          - not_null
      - name: quarantined_events
        tests:
          - not_null
